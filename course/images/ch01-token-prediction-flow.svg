<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Input text tokenization, multi-head attention weighting, and next-token probability distribution">
  <defs>
    <linearGradient id="selectedProb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e71d6"/>
      <stop offset="50%" stop-color="#6a55e4"/>
      <stop offset="100%" stop-color="#bd35c2"/>
    </linearGradient>
  </defs>

  <!-- Section 1: Tokenization -->
  <text x="24" y="28" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">INPUT TEXT TOKENIZATION</text>
  
  <g transform="translate(0, 42)">
    <rect x="24" y="0" width="62" height="30" rx="4" fill="#082445"/>
    <text x="55" y="20" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Draft</text>
    <text x="55" y="42" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="10">t₁</text>

    <rect x="92" y="0" width="36" height="30" rx="4" fill="#082445"/>
    <text x="110" y="20" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">_a</text>
    <text x="110" y="42" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="10">t₂</text>

    <rect x="134" y="0" width="68" height="30" rx="4" fill="#082445"/>
    <text x="168" y="20" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">_status</text>
    <text x="168" y="42" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="10">t₃</text>

    <rect x="208" y="0" width="46" height="30" rx="4" fill="#082445"/>
    <text x="231" y="20" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">_up</text>
    <text x="231" y="42" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="10">t₄</text>

    <rect x="260" y="0" width="52" height="30" rx="4" fill="#082445"/>
    <text x="286" y="20" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">date</text>
    <text x="286" y="42" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="10">t₅</text>

    <rect x="318" y="0" width="44" height="30" rx="4" fill="#082445"/>
    <text x="340" y="20" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">_on</text>
    <text x="340" y="42" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="10">t₆</text>
  </g>

  <!-- Section 2: Attention Mechanism -->
  <text x="24" y="122" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">MULTI-HEAD ATTENTION WEIGHTING</text>

  <!-- Attention links -->
  <path d="M 55 88 C 55 130, 168 130, 168 162" stroke="#1e71d6" stroke-width="1.5" stroke-opacity="0.45" fill="none"/>
  <path d="M 110 88 C 110 135, 340 135, 340 162" stroke="#6a55e4" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <path d="M 168 88 C 168 135, 412 135, 412 162" stroke="#6a55e4" stroke-width="2" stroke-opacity="0.75" fill="none"/>
  <path d="M 231 88 C 231 135, 286 135, 286 162" stroke="#1e71d6" stroke-width="1.5" stroke-opacity="0.5" fill="none"/>
  <path d="M 286 88 C 286 135, 412 135, 412 162" stroke="#bd35c2" stroke-width="2" stroke-opacity="0.85" fill="none"/>
  <path d="M 340 88 C 340 135, 412 135, 412 162" stroke="#bd35c2" stroke-width="2.5" fill="none"/>

  <!-- Attention rail and nodes -->
  <line x1="24" y1="166" x2="440" y2="166" stroke="#082445" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>
  <circle cx="55" cy="166" r="4" fill="#082445"/>
  <circle cx="110" cy="166" r="4" fill="#082445"/>
  <circle cx="168" cy="166" r="4" fill="#1e71d6"/>
  <circle cx="231" cy="166" r="4" fill="#1e71d6"/>
  <circle cx="286" cy="166" r="4" fill="#6a55e4"/>
  <circle cx="340" cy="166" r="4" fill="#6a55e4"/>
  <circle cx="412" cy="166" r="6" fill="#bd35c2"/>
  <text x="412" y="188" text-anchor="middle" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">target t₇</text>

  <!-- Section 3: Next Token Distribution -->
  <text x="24" y="222" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">NEXT-TOKEN CANDIDATES P(w | prompt)</text>

  <!-- Candidate 1 (Selected) -->
  <g transform="translate(0, 240)">
    <text x="24" y="17" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">_the</text>
    <rect x="88" y="2" width="270" height="22" rx="4" fill="none" stroke="#495f7a" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="88" y="2" width="200" height="22" rx="4" fill="url(#selectedProb)"/>
    <text x="296" y="18" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">74%</text>
    <rect x="368" y="3" width="76" height="20" rx="3" fill="#082445"/>
    <text x="406" y="17" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">SELECTED</text>
  </g>

  <!-- Candidate 2 -->
  <g transform="translate(0, 282)">
    <text x="24" y="17" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500">_project</text>
    <rect x="88" y="2" width="270" height="22" rx="4" fill="none" stroke="#495f7a" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="88" y="2" width="46" height="22" rx="4" fill="#1e71d6" fill-opacity="0.45"/>
    <text x="142" y="18" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="12">17%</text>
  </g>

  <!-- Candidate 3 -->
  <g transform="translate(0, 324)">
    <text x="24" y="17" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500">_delay</text>
    <rect x="88" y="2" width="270" height="22" rx="4" fill="none" stroke="#495f7a" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="88" y="2" width="18" height="22" rx="4" fill="#495f7a" fill-opacity="0.4"/>
    <text x="114" y="18" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="12">6%</text>
  </g>

  <!-- Candidate 4 -->
  <g transform="translate(0, 366)">
    <text x="24" y="17" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500">_our</text>
    <rect x="88" y="2" width="270" height="22" rx="4" fill="none" stroke="#495f7a" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="88" y="2" width="9" height="22" rx="4" fill="#495f7a" fill-opacity="0.25"/>
    <text x="105" y="18" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="12">3%</text>
  </g>

  <!-- Flow to appended result -->
  <path d="M 406 265 L 406 422 L 350 422" stroke="#bd35c2" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <rect x="210" y="408" width="132" height="28" rx="4" fill="#082445" stroke="#bd35c2" stroke-width="1.5"/>
  <text x="276" y="426" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">t₇: "_the" appended</text>
</svg>